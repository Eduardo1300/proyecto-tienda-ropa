version: '3.8'

services:
  # Backend NestJS (Production)
  backend:
    build:
      context: ../tienda-backend
      dockerfile: Dockerfile
      target: production
    container_name: tienda-backend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - PORT=3002
      - FRONTEND_URL=${FRONTEND_URL}
    ports:
      - "3002:3002"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend Vue 3 (Production - Nginx)
  frontend:
    build:
      context: ../tienda-frontend
      dockerfile: Dockerfile
      target: production
    container_name: tienda-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Base de datos PostgreSQL (Production - usar managed DB en producción real)
  db:
    image: postgres:16-alpine
    container_name: tienda-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-tienda_ropa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: